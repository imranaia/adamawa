<script>
(function(){
  'use strict';
  if (typeof THREE === 'undefined') return;

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var host = document.getElementById('scene-canvas');

  /* Detect real WebGL support before touching Three.js. Some sandboxed /
     headless / GPU-restricted browsers report WebGL as present but fail on
     actual context creation — probe explicitly and bail to the CSS gradient
     backdrop (already set on #scene-canvas) rather than risk a hung tab. */
  function hasWebGL(){
    try {
      var test = document.createElement('canvas');
      var gl = test.getContext('webgl2') || test.getContext('webgl') || test.getContext('experimental-webgl');
      if (!gl) return false;
      var lose = gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
      return true;
    } catch (e) { return false; }
  }
  if (!hasWebGL()) return;

  var canvas = document.createElement('canvas');
  host.appendChild(canvas);

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
    if (!renderer.getContext()) throw new Error('no gl context');
  } catch (e) {
    host.removeChild(canvas);
    return;
  }
  var contextLost = false;
  canvas.addEventListener('webglcontextlost', function(ev){ ev.preventDefault(); contextLost = true; });
  canvas.addEventListener('webglcontextcreationerror', function(){ contextLost = true; });
  /* Belt-and-suspenders: some GPU-sandboxed browsers report a context object
     that looks valid at creation time but fails on actual draw calls (the
     failure only surfaces as a runtime error, not a creation-time one). A
     single bad frame must not turn into 60 thrown errors/sec, so the render
     call itself is guarded and permanently disables the loop on first failure. */
  var renderFailed = false;

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  var scene = new THREE.Scene();
  var fogColor = new THREE.Color('#20233a');
  scene.fog = new THREE.FogExp2(fogColor.getHex(), 0.012);
  scene.background = fogColor;

  var camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.position.set(0, 18, 46);

  /* ---------------- lights ---------------- */
  var hemi = new THREE.HemisphereLight('#8b9bcb', '#2a1a10', 0.9);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight('#e78a5c', 1.6);
  sun.position.set(-30, 14, -20);
  scene.add(sun);

  /* ---------------- terrain ---------------- */
  var noiseGLSL = [
    'vec3 mod289(vec3 x){return x - floor(x * (1.0/289.0)) * 289.0;}',
    'vec2 mod289(vec2 x){return x - floor(x * (1.0/289.0)) * 289.0;}',
    'vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}',
    'float snoise(vec2 v){',
    '  const vec4 C = vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);',
    '  vec2 i  = floor(v + dot(v, C.yy));',
    '  vec2 x0 = v -   i + dot(i, C.xx);',
    '  vec2 i1 = (x0.x > x0.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);',
    '  vec4 x12 = x0.xyxy + C.xxzz;',
    '  x12.xy -= i1;',
    '  i = mod289(i);',
    '  vec3 p = permute(permute(i.y + vec3(0.0,i1.y,1.0)) + i.x + vec3(0.0,i1.x,1.0));',
    '  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);',
    '  m = m*m; m = m*m;',
    '  vec3 x = 2.0 * fract(p * C.www) - 1.0;',
    '  vec3 h = abs(x) - 0.5;',
    '  vec3 ox = floor(x + 0.5);',
    '  vec3 a0 = x - ox;',
    '  m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);',
    '  vec3 g;',
    '  g.x  = a0.x * x0.x + h.x * x0.y;',
    '  g.yz = a0.yz * x12.xz + h.yz * x12.yw;',
    '  return 130.0 * dot(m, g);',
    '}',
    'float fbm(vec2 p){',
    '  float v = 0.0; float a = 0.55;',
    '  for (int i = 0; i < 5; i++){ v += a * snoise(p); p *= 2.02; a *= 0.52; }',
    '  return v;',
    '}'
  ].join('\n');

  var terrainGeo = new THREE.PlaneGeometry(240, 240, 180, 180);
  terrainGeo.rotateX(-Math.PI / 2);

  var terrainMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColorLow:  { value: new THREE.Color('#5a2a17') },
      uColorMid:  { value: new THREE.Color('#c07a3a') },
      uColorHigh: { value: new THREE.Color('#8b93a8') },
      uColorPeak: { value: new THREE.Color('#e8e4da') },
      uFogColor:  { value: fogColor },
      uFogDensity:{ value: 0.012 }
    },
    vertexShader: [
      'varying float vHeight;',
      'varying vec3 vWorldPos;',
      noiseGLSL,
      'void main(){',
      '  vec3 pos = position;',
      '  vec2 p = pos.xz * 0.012;',
      '  float base = fbm(p) * 6.5;',
      '  vec2 ridgeCenter = vec2(0.62, -0.38);',
      '  float d = distance(pos.xz / 120.0, ridgeCenter);',
      '  float ridgeMask = smoothstep(0.85, 0.0, d);',
      '  float ridge = fbm(p * 1.6 + 4.0) * 1.0;',
      '  ridge = abs(ridge);',
      '  float mountains = pow(ridge, 1.3) * 18.0 * ridgeMask;',
      '  float h = base + mountains;',
      '  pos.y += h;',
      '  vHeight = h;',
      '  vec4 world = modelMatrix * vec4(pos, 1.0);',
      '  vWorldPos = world.xyz;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying float vHeight;',
      'varying vec3 vWorldPos;',
      'uniform vec3 uColorLow, uColorMid, uColorHigh, uColorPeak, uFogColor;',
      'uniform float uFogDensity;',
      'void main(){',
      '  float t1 = smoothstep(-1.0, 3.0, vHeight);',
      '  float t2 = smoothstep(3.0, 9.0, vHeight);',
      '  float t3 = smoothstep(9.0, 15.0, vHeight);',
      '  vec3 c = mix(uColorLow, uColorMid, t1);',
      '  c = mix(c, uColorHigh, t2);',
      '  c = mix(c, uColorPeak, t3);',
      '  float dist = length(cameraPosition - vWorldPos);',
      '  float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);',
      '  c = mix(c, uFogColor, clamp(fogFactor, 0.0, 1.0));',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });

  var terrain = new THREE.Mesh(terrainGeo, terrainMat);
  terrain.position.y = -6;
  scene.add(terrain);

  /* ---------------- river ribbon ---------------- */
  var riverGeo = new THREE.PlaneGeometry(140, 5, 1, 1);
  riverGeo.rotateX(-Math.PI / 2);
  var riverMat = new THREE.MeshBasicMaterial({ color: '#4a5c8c', transparent: true, opacity: 0.55 });
  var river = new THREE.Mesh(riverGeo, riverMat);
  river.rotation.z = 0.18;
  river.position.set(-8, -4.4, 10);
  scene.add(river);

  /* ---------------- starfield ---------------- */
  var starCount = 900;
  var starGeo = new THREE.BufferGeometry();
  var starPos = new Float32Array(starCount * 3);
  for (var i = 0; i < starCount; i++){
    var r = 140 + Math.random() * 60;
    var theta = Math.random() * Math.PI * 2;
    var phi = Math.random() * Math.PI * 0.42;
    starPos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    starPos[i*3+1] = 20 + r * Math.cos(phi) * 0.6;
    starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var starMat = new THREE.PointsMaterial({ color: '#f2ecdd', size: 0.7, transparent: true, opacity: 0.75, sizeAttenuation: true });
  var stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  /* ---------------- sun glow sprite ---------------- */
  function makeGlowTexture(){
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var ctx = c.getContext('2d');
    var g = ctx.createRadialGradient(128,128,0,128,128,128);
    g.addColorStop(0, 'rgba(240,200,120,0.95)');
    g.addColorStop(0.35, 'rgba(224,138,92,0.55)');
    g.addColorStop(1, 'rgba(224,138,92,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(c);
  }
  var sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeGlowTexture(), transparent: true, depthWrite: false }));
  sunSprite.scale.set(70, 70, 1);
  sunSprite.position.set(-34, 16, -22);
  scene.add(sunSprite);

  /* ---------------- camera path ---------------- */
  var posPoints = [
    new THREE.Vector3(0, 20, 50),
    new THREE.Vector3(-6, 15, 30),
    new THREE.Vector3(10, 9, 14),
    new THREE.Vector3(18, 30, 4),
    new THREE.Vector3(2, 7, -4),
    new THREE.Vector3(-14, 13, -12),
    new THREE.Vector3(0, 10, 20)
  ];
  var lookPoints = [
    new THREE.Vector3(0, 2, 0),
    new THREE.Vector3(4, 0, -4),
    new THREE.Vector3(6, -2, -6),
    new THREE.Vector3(0, -3, 0),
    new THREE.Vector3(-4, -1, -10),
    new THREE.Vector3(6, 2, -6),
    new THREE.Vector3(0, 3, -6)
  ];
  var posCurve = new THREE.CatmullRomCurve3(posPoints, false, 'catmullrom', 0.4);
  var lookCurve = new THREE.CatmullRomCurve3(lookPoints, false, 'catmullrom', 0.4);

  var scrollT = 0, smoothT = 0;
  function updateScroll(){
    var max = document.body.scrollHeight - window.innerHeight;
    scrollT = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  }
  window.addEventListener('scroll', updateScroll, { passive: true });
  updateScroll();

  var mouse = { x: 0, y: 0 };
  window.addEventListener('pointermove', function(e){
    mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
    mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
  }, { passive: true });

  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  var clock = new THREE.Clock();
  var visible = true;
  document.addEventListener('visibilitychange', function(){ visible = !document.hidden; });

  function frame(){
    if (contextLost || renderFailed) return;
    requestAnimationFrame(frame);
    if (!visible) return;
    var dt = clock.getDelta();
    var elapsed = clock.getElapsedTime();

    smoothT += (scrollT - smoothT) * (reduceMotion ? 1 : 0.06);
    var tt = Math.min(0.999, Math.max(0, smoothT));

    var camPos = posCurve.getPoint(tt);
    var lookAt = lookCurve.getPoint(tt);

    var parallaxX = reduceMotion ? 0 : mouse.x * 2.2;
    var parallaxY = reduceMotion ? 0 : mouse.y * 1.1;
    var bob = reduceMotion ? 0 : Math.sin(elapsed * 0.4) * 0.4;

    camera.position.set(camPos.x + parallaxX, camPos.y + bob + parallaxY * 0.3, camPos.z);
    camera.lookAt(lookAt.x + parallaxX * 0.4, lookAt.y, lookAt.z);

    terrainMat.uniforms.uTime.value = elapsed;
    stars.rotation.y = elapsed * 0.004;
    river.material.opacity = 0.45 + Math.sin(elapsed * 0.6) * 0.08;

    try {
      renderer.render(scene, camera);
    } catch (e) {
      renderFailed = true;
      try { host.removeChild(canvas); } catch (e2) {}
    }
  }
  frame();
})();
</script>
