<script>
(function(){
  'use strict';

  /* ================================================================
     DATA — filled from researched, cited sources.
     ================================================================ */
  const DATA = {
    facts: {
      'population':      { v: '—', src: '' },
      'population-2':    { v: '—', src: '' },
      'state-founded':   { v: '—', src: '' },
      'state-founded-2': { v: '—', src: '' },
      'land-area':       { v: '—', src: '' }
    },
    governor: {
      bio: '—',
      source: ''
    },
    eras: [ /* { when, title, body, source } */ ],
    lgas: [ /* { name, zone: 'north'|'central'|'south', hq, note, source } */ ],
    minerals: [ /* { name, where, note, source } */ ],
    achievements: [ /* { title, body, source, sourceUrl } */ ],
    landmarks: [ /* { name, note, palette:[hex,hex] } */ ],
    sources: [ /* { label, url } */ ]
  };
  window.__ADAMAWA_DATA__ = DATA; // populated by a later script block

  /* ================================================================
     RENDER — build DOM from DATA once it is populated
     ================================================================ */
  function applyFacts(){
    document.querySelectorAll('[data-fact]').forEach(function(el){
      var key = el.getAttribute('data-fact');
      var f = DATA.facts[key];
      if (f && f.v) el.textContent = f.v;
    });
    if (DATA.governor.bio && DATA.governor.bio !== '—'){
      var bioEl = document.querySelector('[data-fact="governor-bio"]');
      if (bioEl) bioEl.textContent = DATA.governor.bio;
      var srcEl = document.querySelector('[data-fact="governor-source"]');
      if (srcEl) srcEl.textContent = DATA.governor.source;
    }
  }

  function renderEras(){
    var host = document.getElementById('history-list');
    if (!host || !DATA.eras.length) return;
    host.innerHTML = DATA.eras.map(function(e){
      return '<article class="era"><div class="era__when num">' + e.when + '</div>' +
        '<div class="era__body"><h3>' + e.title + '</h3><p>' + e.body + '</p></div></article>';
    }).join('');
  }

  var ZONE_LABEL = { north: 'Adamawa North', central: 'Adamawa Central', south: 'Adamawa South' };

  function renderLgas(){
    var host = document.getElementById('lga-grid');
    if (!host || !DATA.lgas.length) return;
    host.innerHTML = DATA.lgas.map(function(l, i){
      return '<button class="lga-card" data-zone="' + l.zone + '" data-i="' + i + '">' +
        '<div class="lga-card__n num">' + String(i+1).padStart(2,'0') + '</div>' +
        '<div class="lga-card__name">' + l.name + '</div>' +
        '<div class="lga-card__hq">HQ &middot; ' + l.hq + '</div></button>';
    }).join('');

    host.querySelectorAll('.lga-card').forEach(function(card){
      card.addEventListener('click', function(){
        var l = DATA.lgas[+card.getAttribute('data-i')];
        var detail = document.getElementById('lga-detail');
        detail.innerHTML =
          '<button class="lga-detail__close" id="lga-detail-close" aria-label="Close">&times;</button>' +
          '<div><h4>' + l.name + '</h4><span class="zone-pill">' + ZONE_LABEL[l.zone] + '</span>' +
          '<p>Headquarters: ' + l.hq + '</p></div>' +
          '<div><p>' + (l.note || 'Detailed settlement-level data for this LGA is limited in public sources — headquarters town is verified.') + '</p></div>';
        detail.classList.add('is-open');
        detail.querySelector('#lga-detail-close').addEventListener('click', function(){ detail.classList.remove('is-open'); });
        detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
    });
  }

  function initZoneTabs(){
    var tabs = document.querySelectorAll('.zone-tab');
    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.classList.remove('is-active'); });
        tab.classList.add('is-active');
        var zone = tab.getAttribute('data-zone');
        document.querySelectorAll('.lga-card').forEach(function(card){
          card.style.display = (zone === 'all' || card.getAttribute('data-zone') === zone) ? '' : 'none';
        });
      });
    });
  }

  function renderMinerals(){
    var host = document.getElementById('res-grid');
    if (!host || !DATA.minerals.length) return;
    host.innerHTML = DATA.minerals.map(function(m, i){
      return '<div class="res-card"><canvas data-seed="' + i + '"></canvas>' +
        '<div class="res-card__inner"><div class="res-card__name">' + m.name + '</div>' +
        '<div class="res-card__where">' + m.where + '</div>' +
        '<div class="res-card__note">' + m.note + '</div></div></div>';
    }).join('');
    host.querySelectorAll('canvas').forEach(paintTexture);
  }

  function renderAchievements(){
    var host = document.getElementById('achv-list');
    if (!host || !DATA.achievements.length) return;
    var icons = [
      '<path d="M3 12h4l3 8 4-16 3 8h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
      '<path d="M12 3v18M4 9l8-6 8 6M6 21V11h12v10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
      '<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 8v4l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
      '<path d="M4 20V10l8-6 8 6v10M9 20v-6h6v6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    ];
    host.innerHTML = DATA.achievements.map(function(a, i){
      var src = a.sourceUrl
        ? '<a class="achv__src" href="' + a.sourceUrl + '" target="_blank" rel="noopener">' + a.source + '</a>'
        : '<span class="achv__src">' + (a.source || '') + '</span>';
      return '<article class="achv"><div class="achv__icon"><svg viewBox="0 0 24 24">' + icons[i % icons.length] + '</svg></div>' +
        '<div><h4>' + a.title + '</h4><p>' + a.body + '</p>' + src + '</div></article>';
    }).join('');
  }

  function renderLandmarks(){
    var host = document.getElementById('landmark-scroll');
    if (!host || !DATA.landmarks.length) return;
    host.innerHTML = DATA.landmarks.map(function(l, i){
      return '<div class="landmark"><canvas data-seed="' + (i+50) + '" data-palette="' + (l.palette||[]).join(',') + '"></canvas>' +
        '<div class="landmark__label"><p class="label">Landmark</p><h4>' + l.name + '</h4><p>' + l.note + '</p></div></div>';
    }).join('');
    host.querySelectorAll('canvas').forEach(paintTexture);
  }

  function renderSources(){
    var host = document.getElementById('footer-sources');
    if (!host || !DATA.sources.length) return;
    host.innerHTML = '<span style="color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; font-size:.68rem;">Sources</span>' +
      DATA.sources.map(function(s){ return '<a href="' + s.url + '" target="_blank" rel="noopener">' + s.label + '</a>'; }).join('');
  }

  /* Simple generative 2D texture used behind mineral / landmark cards.
     Value-noise field rendered to canvas, tinted per-card. No external assets. */
  function paintTexture(canvas){
    var seed = +canvas.getAttribute('data-seed') || 1;
    var paletteAttr = canvas.getAttribute('data-palette');
    var palette = paletteAttr ? paletteAttr.split(',').filter(Boolean) : ['#d0602e', '#e3ac4d'];
    function resize(){
      var r = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, r.width * (window.devicePixelRatio||1) * 0.5);
      canvas.height = Math.max(1, r.height * (window.devicePixelRatio||1) * 0.5);
    }
    resize();
    var ctx = canvas.getContext('2d');
    var w = canvas.width, h = canvas.height;
    var rand = mulberry32(seed * 999);
    ctx.fillStyle = '#00000000';
    ctx.clearRect(0,0,w,h);
    var grd = ctx.createRadialGradient(w*0.7, h*0.25, 0, w*0.5, h*0.5, w*0.9);
    grd.addColorStop(0, hexA(palette[0], 0.55));
    grd.addColorStop(1, hexA(palette[1]||palette[0], 0));
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,w,h);
    var n = 46;
    for (var i=0;i<n;i++){
      var x = rand()*w, y = rand()*h, r = rand()*w*0.05 + w*0.005;
      ctx.beginPath();
      ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle = hexA(palette[i % palette.length], 0.10 + rand()*0.12);
      ctx.fill();
    }
  }
  function hexA(hex, a){
    hex = hex || '#d0602e';
    var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ================================================================
     NAV / BURGER
     ================================================================ */
  function initNav(){
    var burger = document.getElementById('burger');
    var sheet = document.getElementById('nav-sheet');
    function closeSheet(){ sheet.classList.remove('is-open'); burger.setAttribute('aria-expanded','false'); }
    burger.addEventListener('click', function(){
      var open = sheet.classList.toggle('is-open');
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    sheet.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeSheet); });
  }

  /* ================================================================
     SCROLL REVEALS
     ================================================================ */
  function initReveals(){
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.querySelectorAll('.era, .achv').forEach(function(el){ el.classList.add('is-visible'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add('is-visible');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.01, rootMargin: '0px 0px -3% 0px' });
    document.querySelectorAll('.era, .achv').forEach(function(el){ io.observe(el); });

    /* IntersectionObserver can miss a callback when the viewport jumps a
       long distance in one step (large trackpad flick, End key, or — as
       seen in testing — a fast programmatic scroll). A cheap rAF-throttled
       sweep acts as a safety net so nothing is ever stuck at opacity:0. */
    var ticking = false;
    function sweep(){
      ticking = false;
      document.querySelectorAll('.era:not(.is-visible), .achv:not(.is-visible)').forEach(function(el){
        // top-edge-reached is enough: a large instant jump (End key, a fast
        // trackpad flick, or this tool's discrete scroll steps) can leap an
        // element clean over the viewport without ever rendering it — in
        // that case it has already been "passed," so reveal it immediately
        // rather than leaving it stuck at opacity:0 above the fold.
        if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('is-visible');
      });
    }
    function onScroll(){
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(sweep);
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    sweep();
  }
  function reobserveReveals(){
    // call after dynamic render so newly-created .era/.achv nodes get observed
    initReveals();
  }

  /* ================================================================
     CHAT ENGINE — offline retrieval over the embedded knowledge base.
     No network calls (Artifact sandbox blocks external requests);
     this indexes DATA itself, so answers stay in sync with the page.
     ================================================================ */
  var corpus = [];
  function buildCorpus(){
    corpus = [];
    if (DATA.facts['state-founded'] && DATA.facts['state-founded'].v !== '—'){
      corpus.push({ text: 'when was adamawa state created founded formed history date', answer: 'Adamawa State was created on ' + DATA.facts['state-founded'].v + '.', source: DATA.facts['state-founded'].src });
    }
    if (DATA.facts.population.v !== '—'){
      corpus.push({ text: 'population how many people live in adamawa', answer: 'Adamawa State has a population of approximately ' + DATA.facts.population.v + '.', source: DATA.facts.population.src });
    }
    if (DATA.facts['land-area'].v !== '—'){
      corpus.push({ text: 'land area size how big is adamawa square kilometres', answer: 'Adamawa State covers roughly ' + DATA.facts['land-area'].v + '.', source: DATA.facts['land-area'].src });
    }
    corpus.push({ text: 'capital city of adamawa', answer: 'The capital of Adamawa State is Yola.', source: '' });
    // governor bio is pushed early (before achievements) so a bare "who is
    // Fintiri" / "Fintiri biography" query — which shares the single token
    // "fintiri" with every achievement entry — ties toward the bio, the more
    // natural answer to an identity question, rather than an arbitrary pick.
    if (DATA.governor.bio !== '—'){
      corpus.push({ text: 'governor fintiri biography who is the governor ahmadu umaru fintiri', answer: DATA.governor.bio, source: DATA.governor.source });
    }
    DATA.eras.forEach(function(e){
      corpus.push({ text: (e.title + ' ' + e.body + ' ' + e.when).toLowerCase(), answer: e.title + ' (' + e.when + '). ' + e.body, source: e.source });
    });
    DATA.lgas.forEach(function(l){
      corpus.push({ text: ('local government area lga ' + l.name + ' headquarters ' + l.hq + ' zone ' + ZONE_LABEL[l.zone]).toLowerCase(),
        answer: l.name + ' is a local government area in ' + ZONE_LABEL[l.zone] + '. Its headquarters is ' + l.hq + '.', source: l.source || '' });
    });
    DATA.minerals.forEach(function(m){
      corpus.push({ text: ('mineral resource ' + m.name + ' ' + m.where + ' ' + m.note).toLowerCase(),
        answer: m.answer || (m.name + ' is found in ' + m.where + '. ' + m.note), source: m.source || '' });
    });
    DATA.achievements.forEach(function(a){
      corpus.push({ text: ('governor fintiri achievement ' + a.title + ' ' + a.body).toLowerCase(),
        answer: a.title + ': ' + a.body, source: a.source || '' });
    });
    DATA.landmarks.forEach(function(l){
      corpus.push({ text: ('landmark culture site ' + l.name + ' ' + l.note).toLowerCase(),
        answer: l.name + ': ' + l.note, source: '' });
    });
    // pre-split each entry's text into a word set once, for exact-word scoring
    corpus.forEach(function(entry){ entry.words = new Set(tokenize(entry.text)); });
  }

  var STOPWORDS = new Set(['the','and','for','are','was','were','has','have','had','with','from','this','that',
    'what','when','where','which','who','how','does','do','did','doe','can','you','your','about','into','out',
    'located','tell','know','all','any','some','list','name','state','adamawa']);
  function tokenize(s){
    return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
      .filter(function(t){ return t.length > 2 && !STOPWORDS.has(t); });
  }

  function answerQuery(q){
    var qLower = q.toLowerCase();

    // aggregate intents handled directly against live DATA
    var zoneMatch = null;
    if (/north/.test(qLower)) zoneMatch = 'north';
    else if (/central/.test(qLower)) zoneMatch = 'central';
    else if (/south/.test(qLower)) zoneMatch = 'south';
    if (zoneMatch && /(lga|local government|area)/.test(qLower)){
      var names = DATA.lgas.filter(function(l){ return l.zone === zoneMatch; }).map(function(l){ return l.name; });
      if (names.length) return { text: ZONE_LABEL[zoneMatch] + ' has ' + names.length + ' local government areas: ' + names.join(', ') + '.', source: '' };
    }
    if (/(all|list).*(lga|local government)/.test(qLower) || /how many local government/.test(qLower)){
      if (DATA.lgas.length) return { text: 'Adamawa State has ' + DATA.lgas.length + ' local government areas across three senatorial zones: ' + DATA.lgas.map(function(l){return l.name;}).join(', ') + '.', source: '' };
    }
    if (/mineral/.test(qLower) && /(what|which|list)/.test(qLower)){
      if (DATA.minerals.length) return { text: 'Adamawa is known for: ' + DATA.minerals.map(function(m){return m.name;}).join(', ') + '.', source: '' };
    }
    if (/(governor|fintiri).*(done|achiev|accomplish|record|work)/.test(qLower)){
      if (DATA.achievements.length) return { text: 'Some of the governor’s documented initiatives: ' + DATA.achievements.map(function(a){return a.title;}).join('; ') + '. Ask me about any one of these for detail.', source: '' };
    }

    // scored retrieval over corpus — exact-word overlap, not substring match
    // (substring matching let common short words like "the" inside e.g.
    // "ruler of the southlands" falsely win against unrelated queries)
    var qTokens = tokenize(q);
    if (!qTokens.length || !corpus.length) return null;
    var best = null, bestScore = 0;
    corpus.forEach(function(entry){
      var score = 0;
      qTokens.forEach(function(t){ if (entry.words.has(t)) score++; });
      if (score > bestScore){ bestScore = score; best = entry; }
    });
    // require at least 2 distinct content-word matches (or all of a 1-word
    // query) so a single incidental overlap can't produce a confident but
    // wrong answer — an honest "I don't know" beats a plausible-sounding miss.
    var minScore = Math.min(2, qTokens.length);
    if (best && bestScore >= minScore) return { text: best.answer, source: best.source };
    return null;
  }

  function appendMsg(text, who, source){
    var log = document.getElementById('ask-log');
    var div = document.createElement('div');
    div.className = 'msg ' + who;
    div.innerHTML = text + (source ? '<span class="src">' + source + '</span>' : '');
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function initChat(){
    var form = document.getElementById('ask-form');
    var input = document.getElementById('ask-input');
    var log = document.getElementById('ask-log');
    if (!log.children.length){
      appendMsg('Ask me anything about Adamawa’s history, local governments, resources, or the governor’s record — I answer from the material on this page.', 'bot');
    }
    function handle(q){
      if (!q.trim()) return;
      appendMsg(escapeHtml(q), 'user');
      input.value = '';
      var typing = document.createElement('div');
      typing.className = 'typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      log.appendChild(typing);
      log.scrollTop = log.scrollHeight;
      setTimeout(function(){
        typing.remove();
        var res = answerQuery(q);
        if (res) appendMsg(res.text, 'bot', res.source);
        else appendMsg('I don’t have that in what’s published on this page yet — try asking about the state’s history, a specific local government area, its mineral resources, or the governor’s initiatives.', 'bot');
      }, 420 + Math.random()*380);
    }
    form.addEventListener('submit', function(e){ e.preventDefault(); handle(input.value); });
    document.querySelectorAll('#ask-suggest button').forEach(function(b){
      b.addEventListener('click', function(){ handle(b.getAttribute('data-q')); document.getElementById('ask').scrollIntoView({behavior:'smooth', block:'start'}); });
    });
    function escapeHtml(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    var launcher = document.getElementById('launcher');
    var askSection = document.getElementById('ask');
    function scrollToAsk(){ askSection.scrollIntoView({ behavior:'smooth', block:'start' }); input.focus({preventScroll:true}); }
    launcher.addEventListener('click', scrollToAsk);
    document.getElementById('open-chat-nav').addEventListener('click', scrollToAsk);
    var io2 = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ launcher.classList.toggle('is-hidden', e.isIntersecting); });
    }, { threshold: 0.15 });
    io2.observe(askSection);
  }

  /* ================================================================
     BOOT
     ================================================================ */
  window.__ADAMAWA_BOOT__ = function(){
    applyFacts();
    renderEras();
    renderLgas();
    initZoneTabs();
    renderMinerals();
    renderAchievements();
    renderLandmarks();
    renderSources();
    initNav();
    reobserveReveals();
    buildCorpus();
    initChat();
  };
})();
</script>
