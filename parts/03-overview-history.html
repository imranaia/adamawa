<style>
  /* ---------- overview strip ---------- */
  .overview{ padding-block: clamp(3rem,7vh,4.5rem); }
  .stat-strip{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
    border:1px solid var(--border); border-radius:20px; overflow:hidden;
    background: color-mix(in srgb, var(--bg-deep) 55%, transparent); backdrop-filter: blur(14px);
  }
  .stat-strip__cell{ padding: 1.6rem 1.5rem; border-right:1px solid var(--border); }
  .stat-strip__cell:last-child{ border-right:none; }
  .stat-strip__cell dt{ font-family:var(--font-mono); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:.55rem; }
  .stat-strip__cell dd{ font-family:var(--font-display); font-weight:600; font-size:clamp(1.5rem,2.6vw,2.1rem); color:var(--text); }
  .stat-strip__cell dd small{ font-size:.5em; color:var(--text-dim); font-weight:500; margin-left:.15em; }

  /* ---------- history ---------- */
  .history{ padding-block: clamp(5rem,12vh,8rem); }
  .history__head{ max-width:44rem; margin-bottom: 3.5rem; }
  .history__grid{ display:grid; grid-template-columns: 1fr; gap:0; }
  .era{
    display:grid; grid-template-columns: 8.5rem 1fr; gap: 1.75rem; padding-block: 2.25rem; border-top:1px solid var(--border);
    opacity:0; transform:translateY(28px); transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
  }
  .era.is-visible{ opacity:1; transform:translateY(0); }
  .era:last-child{ border-bottom:1px solid var(--border); }
  .era__when{ font-family:var(--font-mono); font-size:.85rem; color:var(--gold-lt); padding-top:.2rem; }
  .era__body h3{ font-family:var(--font-serif); font-weight:500; font-size:clamp(1.3rem,2vw,1.7rem); color:var(--text); margin-bottom:.65rem; }
  .era__body p{ font-family:var(--font-serif); font-size:1.06rem; line-height:1.75; color:var(--text-dim); max-width:56ch; }
  @media (max-width: 640px){ .era{ grid-template-columns:1fr; gap:.5rem; } }
</style>

<section class="overview wide" id="overview">
  <dl class="stat-strip">
    <div class="stat-strip__cell"><dt>Land area</dt><dd data-fact="land-area">—</dd></div>
    <div class="stat-strip__cell"><dt>Population</dt><dd data-fact="population-2">—</dd></div>
    <div class="stat-strip__cell"><dt>Senatorial zones</dt><dd>3</dd></div>
    <div class="stat-strip__cell"><dt>Local govt. areas</dt><dd>21</dd></div>
    <div class="stat-strip__cell"><dt>State created</dt><dd data-fact="state-founded-2">—</dd></div>
  </dl>
  <p class="label" style="margin-top:1.25rem; text-align:right;">Known nationwide as the &ldquo;Land of Beauty&rdquo;</p>
</section>

<section class="history section-pad wide" id="history">
  <div class="history__head">
    <p class="label" style="margin-bottom:.9rem;">01 &mdash; History</p>
    <h2 class="d-l">From Fombina to<br>the Federal Republic.</h2>
  </div>
  <div class="history__grid" id="history-list">
    <!-- ERA_CARDS_PLACEHOLDER -->
  </div>
</section>
