<title>Adamawa</title>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     TOKENS — dusk-over-savanna, dark-only by deliberate commitment
     ============================================================ */
  :root{
    --bg:            #12130f;
    --bg-deep:       #0b0c09;
    --surface:       #1c1c16;
    --surface-2:     #262620;
    --surface-3:     #302f27;
    --border:        rgba(240, 230, 205, 0.10);
    --border-strong: rgba(240, 230, 205, 0.20);

    --text:          #f2ecdd;
    --text-dim:      #b8b0a0;
    --text-faint:    #7d7768;

    --terracotta:    #d0602e;
    --terracotta-lt: #e78a5c;
    --gold:          #e3ac4d;
    --gold-lt:       #f0c878;
    --dusk:          #5a6fa8;
    --dusk-lt:       #8b9bcb;
    --dusk-dp:       #262c47;

    --pos:           #7fae6a;
    --focus:         var(--gold-lt);

    --font-display:  "Bricolage Grotesque", "Arial Narrow", sans-serif;
    --font-serif:    "Newsreader", Georgia, serif;
    --font-mono:     "IBM Plex Mono", ui-monospace, monospace;

    --ease-out:      cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in-out:   cubic-bezier(0.65, 0, 0.35, 1);
    --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1);

    --container:     1240px;
    --gutter:        clamp(1.25rem, 4vw, 3rem);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ color-scheme: dark; scroll-behavior:smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
  }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection{ background: var(--terracotta); color: var(--bg-deep); }

  a{ color: inherit; }
  h1,h2,h3,h4,p,ul,ol,dl,figure,blockquote{ margin:0; }
  ul{ padding:0; list-style:none; }
  img,svg,canvas{ display:block; max-width:100%; }
  button{ font-family:inherit; }

  :focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 3px;
    border-radius: 2px;
  }

  .wide{
    max-width: var(--container);
    margin-inline: auto;
    padding-inline: var(--gutter);
  }

  .h-scroll{ overflow-x:auto; scrollbar-width:thin; }

  /* type scale */
  .d-xl{ font-family:var(--font-display); font-weight:600; font-size:clamp(2.75rem, 6.2vw, 6.75rem); line-height:0.98; letter-spacing:-0.02em; text-wrap:balance; }
  .d-l{  font-family:var(--font-display); font-weight:600; font-size:clamp(2rem, 4.2vw, 3.6rem); line-height:1.04; letter-spacing:-0.015em; text-wrap:balance; }
  .d-m{  font-family:var(--font-display); font-weight:600; font-size:clamp(1.4rem, 2.4vw, 2.05rem); line-height:1.12; letter-spacing:-0.01em; text-wrap:balance; }
  .body-l{ font-size:1.2rem; line-height:1.65; color:var(--text-dim); max-width:52ch; }
  .body{ font-size:1.0625rem; line-height:1.7; color:var(--text-dim); max-width:60ch; }
  .label{ font-family:var(--font-mono); font-size:0.72rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-faint); }
  .num{ font-variant-numeric: tabular-nums; font-family:var(--font-mono); }
  .serif{ font-family:var(--font-serif); }
  .serif-i{ font-family:var(--font-serif); font-style:italic; font-weight:400; }

  /* ============================================================
     BACKDROP CANVAS — persistent 3D scene behind everything
     ============================================================ */
  #scene-canvas{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    background: linear-gradient(180deg, #171a29 0%, #22233a 32%, #3a3245 55%, #5c3f3a 74%, #23140f 100%);
  }
  #scene-fallback-note{
    position: fixed; inset:auto 0 0 0; text-align:center; padding:.5rem;
    font-family:var(--font-mono); font-size:.65rem; color:var(--text-faint); z-index:1; pointer-events:none;
  }

  main{ position:relative; z-index:1; }

  /* section scaffolding */
  section{ position:relative; }
  .section-pad{ padding-block: clamp(5rem, 12vh, 9rem); }
  .scrim{
    background: linear-gradient(180deg, rgba(18,19,15,0) 0%, rgba(18,19,15,.72) 14%, rgba(18,19,15,.92) 100%);
  }
  .card-surface{
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(18px);
    border: 1px solid var(--border);
    border-radius: 22px;
  }

  hr.rule{ border:none; border-top:1px solid var(--border); margin:0; }
</style>
