<style>
  /* ---------- governance / LGA explorer ---------- */
  .governance{ padding-block: clamp(5rem,12vh,8rem); }
  .gov-head{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:1.5rem; margin-bottom: 2.75rem; }
  .gov-head .d-l{ max-width:34rem; }

  .zone-tabs{ display:flex; gap:.5rem; flex-wrap:wrap; }
  .zone-tab{
    font-family:var(--font-mono); font-size:.78rem; letter-spacing:.02em; color:var(--text-dim);
    background:transparent; border:1px solid var(--border-strong); border-radius:999px; padding:.55rem 1.1rem; cursor:pointer;
    transition: all .3s var(--ease-out);
  }
  .zone-tab.is-active{ background:var(--terracotta); border-color:var(--terracotta); color:#1b0d05; font-weight:600; }
  .zone-tab:hover:not(.is-active){ border-color:var(--text-faint); color:var(--text); }

  .lga-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap: 1px;
    background: var(--border); border:1px solid var(--border); border-radius:20px; overflow:hidden;
  }
  .lga-card{
    background: var(--surface); padding: 1.5rem 1.4rem; cursor:pointer; position:relative;
    transition: background .3s var(--ease-out);
  }
  .lga-card:hover, .lga-card:focus-visible{ background:var(--surface-2); }
  .lga-card__n{ font-family:var(--font-mono); font-size:.68rem; color:var(--text-faint); }
  .lga-card__name{ font-family:var(--font-display); font-weight:600; font-size:1.15rem; margin-top:.5rem; color:var(--text); }
  .lga-card__hq{ font-size:.8rem; color:var(--text-dim); margin-top:.3rem; }

  .lga-detail{
    margin-top:1.25rem; border-radius:20px; padding:2rem 2.25rem; display:none; gap:1.5rem;
  }
  .lga-detail.is-open{ display:grid; grid-template-columns: 1fr 1fr; }
  .lga-detail h4{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; }
  .lga-detail .zone-pill{ display:inline-block; margin-top:.4rem; font-family:var(--font-mono); font-size:.7rem; color:var(--gold-lt); text-transform:uppercase; letter-spacing:.1em; }
  .lga-detail p{ font-size:.95rem; line-height:1.65; color:var(--text-dim); margin-top:.9rem; }
  .lga-detail__close{ position:absolute; top:1.3rem; right:1.3rem; background:none; border:none; color:var(--text-faint); cursor:pointer; }
  @media (max-width:640px){ .lga-detail.is-open{ grid-template-columns:1fr; } }

  /* ---------- resources ---------- */
  .resources{ padding-block: clamp(5rem,12vh,8rem); }
  .res-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:20px; overflow:hidden; margin-top:2.5rem; }
  .res-card{ background:var(--surface); padding:2rem 1.75rem; position:relative; overflow:hidden; min-height:220px; display:flex; flex-direction:column; justify-content:flex-end; }
  .res-card canvas{ position:absolute; inset:0; width:100%; height:100%; opacity:.55; }
  .res-card__inner{ position:relative; z-index:1; }
  .res-card__name{ font-family:var(--font-display); font-weight:600; font-size:1.3rem; color:var(--text); }
  .res-card__where{ font-family:var(--font-mono); font-size:.72rem; color:var(--gold-lt); text-transform:uppercase; letter-spacing:.08em; margin-top:.5rem; }
  .res-card__note{ font-size:.88rem; color:var(--text-dim); margin-top:.6rem; line-height:1.55; }
</style>

<section class="governance section-pad wide" id="governance">
  <div class="gov-head">
    <div>
      <p class="label" style="margin-bottom:.9rem;">02 &mdash; Governance</p>
      <h2 class="d-l">Twenty-one local governments,<br>three senatorial zones.</h2>
    </div>
    <div class="zone-tabs" id="zone-tabs">
      <button class="zone-tab is-active" data-zone="all">All</button>
      <button class="zone-tab" data-zone="north">Adamawa North</button>
      <button class="zone-tab" data-zone="central">Adamawa Central</button>
      <button class="zone-tab" data-zone="south">Adamawa South</button>
    </div>
  </div>
  <div class="lga-grid" id="lga-grid"><!-- LGA_CARDS_PLACEHOLDER --></div>
  <div class="lga-detail card-surface" id="lga-detail">
    <button class="lga-detail__close" id="lga-detail-close" aria-label="Close">&times;</button>
  </div>
</section>

<section class="resources section-pad wide" id="resources">
  <p class="label" style="margin-bottom:.9rem;">03 &mdash; Natural resources</p>
  <h2 class="d-l">What the ground holds.</h2>
  <p class="body-l" style="margin-top:1.25rem;">Adamawa's economy runs on more than farmland — the state sits on mineral deposits that remain largely untapped.</p>
  <div class="res-grid" id="res-grid"><!-- RESOURCE_CARDS_PLACEHOLDER --></div>
</section>
